title = "SkadiCore gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, examples, and third-party vendored code"
paths = [
  '''(?i)crates/.*/tests/''',
  '''(?i)examples/''',
  '''(?i)third_party/''',
  '''(?i)\.cargo/''',
]
regexTarget = "match"
regexes = [
  '''test-only-not-a-secret''',
  '''change-me''',
  '''<client-private-key>''',
  '''<client-public-key>''',
  '''<server-private-key>''',
  '''<server-public-key>''',
  '''<generate-with''',
]
