[server]
listen = "0.0.0.0:443"

# REALITY inbound (рекомендуется для VLESS в продакшене).
# Сгенерировать ключи: skadicore genkey reality
# [transport.reality]
# enabled = true
# dest = "www.microsoft.com:443"
# server_names = ["www.microsoft.com"]
# private_key = "BASE64_X25519_PRIVATE_KEY"
# short_ids = ["0123456789abcdef"]

# TLS inbound (альтернатива REALITY, не включать оба одновременно).
# [transport.tls]
# enabled = true
# cert = "certs/default.pem"       # fallback при неизвестном SNI
# key = "certs/default.key"
# alpn = ["h2", "http/1.1"]
#
# [[transport.tls.certificates]]
# server_names = ["example.com"]
# cert = "certs/example.pem"
# key = "certs/example-key.pem"

[protocol.socks5]
enabled = false

[protocol.vless]
enabled = true

[[protocol.vless.users]]
id = "b831381d-6324-4d53-ad4f-8cda48b30811"
email = "alice@example.com"

# gRPC API — hot reload пользователей без рестарта.
