name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-client -p skadi-server --all-targets

      - name: Install xray e2e dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip

      - name: cargo test
        run: cargo test -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-client -p skadi-server

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  smoke-transports:
    name: smoke-transports (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run scripts/smoke-transports.sh
        run: chmod +x scripts/smoke-transports.sh && ./scripts/smoke-transports.sh

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  miri:
    name: Miri (memory safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo miri setup
        # rust-toolchain.toml pins stable; Miri lives on nightly only.
        run: cargo +nightly miri setup

      - name: cargo miri test (parsers)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test -p skadi-protocol
          cargo +nightly miri test -p skadi-server --lib connection_gate

  musl:
    name: musl static build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            use_zigbuild: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            use_zigbuild: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target (pinned toolchain)
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools (x86_64)
        if: ${{ !matrix.use_zigbuild }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig + cargo-zigbuild (aarch64)
        if: matrix.use_zigbuild
        run: |
          pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: mlugg/setup-zig@v2
        if: matrix.use_zigbuild

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo build (musl)
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release -p skadi-server --target ${{ matrix.target }}
          else
            cargo build --release -p skadi-server --target ${{ matrix.target }}
          fi

      - name: Install QEMU user emulation (aarch64)
        if: matrix.use_zigbuild
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Verify static binary
        run: |
          BIN=target/${{ matrix.target }}/release/skadicore
          file "$BIN" | grep -E 'statically linked|static-pie'
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            file "$BIN" | grep -i aarch64
            qemu-aarch64-static "$BIN" --version
            qemu-aarch64-static "$BIN" check-config --config examples/reality-vless/server.toml
          else
            "$BIN" --version
            "$BIN" check-config --config examples/reality-vless/server.toml
          fi

  cross-platform:
    name: cross build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: windows-x86_64
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            arch: macos-aarch64
            target: aarch64-apple-darwin
          - os: macos-latest
            arch: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install mingw-w64 (Windows GNU)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo build (cross)
        run: |
          chmod +x scripts/build-cross.sh
          TARGET=${{ matrix.target }} ./scripts/build-cross.sh

      - name: Verify binary (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          BIN=target/${{ matrix.target }}/release/skadicore.exe
          file "$BIN" | grep -i 'PE32'
          ls -la "$BIN"

      - name: Verify binary (macOS)
        if: startsWith(matrix.target, 'aarch64-apple') || startsWith(matrix.target, 'x86_64-apple')
        run: |
          BIN=target/${{ matrix.target }}/release/skadicore
          file "$BIN"
          "$BIN" --version
          "$BIN" check-config --config examples/reality-vless/server.toml

  benchmarks:
    name: Benchmarks (criterion smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo bench --test
        run: |
          cargo bench -p skadi-protocol -- --test
          cargo bench -p skadi-transport -- --test

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config curl unzip

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin
        run: |
          cargo tarpaulin \
            -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-server \
            --exclude-files 'third_party/*' \
            --fail-under 70 \
            --timeout 600

  soak-smoke:
    name: Soak smoke (--quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install soak dependencies
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Run soak smoke
        run: ./scripts/soak.sh --quick

  docker:
    name: Docker image (musl scratch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skadicore:ci .
