name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-server --all-targets

      - name: Install xray e2e dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip

      - name: cargo test
        run: cargo test -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-server

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  miri:
    name: Miri (memory safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo miri setup
        # rust-toolchain.toml pins stable; Miri lives on nightly only.
        run: cargo +nightly miri setup

      - name: cargo miri test (parsers)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test -p skadi-protocol
          cargo +nightly miri test -p skadi-server --lib connection_gate

  benchmarks:
    name: Benchmarks (criterion smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo bench --test
        run: |
          cargo bench -p skadi-protocol -- --test
          cargo bench -p skadi-transport -- --test

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config curl unzip

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: cargo tarpaulin
        run: |
          cargo tarpaulin \
            -p skadi-core -p skadi-transport -p skadi-protocol -p skadi-api -p skadi-server \
            --exclude-files 'third_party/*' \
            --fail-under 70 \
            --timeout 600
