name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            use_zigbuild: false
          - os: ubuntu-latest
            arch: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            use_zigbuild: true
          - os: ubuntu-latest
            arch: windows-x86_64-gnu
            target: x86_64-pc-windows-gnu
            use_zigbuild: false
          - os: macos-latest
            arch: macos-aarch64
            target: aarch64-apple-darwin
            use_zigbuild: false
          - os: macos-latest
            arch: macos-x86_64
            target: x86_64-apple-darwin
            use_zigbuild: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ steps.version.outputs.version }}" != "$CARGO_VERSION" ]; then
            echo "Tag version ${{ steps.version.outputs.version }} != Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target (musl / cross)
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools (x86_64 linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig + cargo-zigbuild (aarch64 linux)
        if: matrix.use_zigbuild
        run: |
          pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: mlugg/setup-zig@v2
        if: matrix.use_zigbuild

      - name: Install mingw-w64 (Windows GNU)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release -p skadi-server --target ${{ matrix.target }}
          elif [[ "${{ matrix.target }}" == *"linux-musl"* ]]; then
            cargo build --release -p skadi-server --target ${{ matrix.target }}
          else
            chmod +x scripts/build-cross.sh
            TARGET=${{ matrix.target }} ./scripts/build-cross.sh
          fi

      - name: Package binary
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skadicore-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge SHA256 checksums
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          (
            cd dist
            sha256sum skadicore-* > SHA256SUMS
          )
          ls -la dist/

      - name: Sync signing script from default branch
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}" --depth=1
          git checkout "origin/${{ github.event.repository.default_branch }}" -- scripts/sign-release.sh

      - name: Sign release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSPHRASE: ${{ secrets.MINISIGN_KEY_PASSPHRASE }}
        run: |
          if [ -n "${MINISIGN_SECRET_KEY}" ]; then
            curl -fsSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz \
              | tar xz -C /tmp
            sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
            chmod +x scripts/sign-release.sh
            ./scripts/sign-release.sh
          else
            echo "MINISIGN_SECRET_KEY not configured — skipping signatures"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SkadiCore ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/skadicore-*.tar.gz
            dist/skadicore-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Upload release signatures
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "${MINISIGN_SECRET_KEY}" ] && compgen -G "dist/*.minisig" > /dev/null; then
            gh release upload "${{ steps.version.outputs.tag }}" dist/*.minisig --clobber
          fi
