name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            use_zigbuild: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            use_zigbuild: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ steps.version.outputs.version }}" != "$CARGO_VERSION" ]; then
            echo "Tag version ${{ steps.version.outputs.version }} != Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64)
        if: ${{ !matrix.use_zigbuild }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig + cargo-zigbuild (aarch64)
        if: matrix.use_zigbuild
        run: |
          pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: mlugg/setup-zig@v2
        if: matrix.use_zigbuild

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: cargo build (musl)
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release -p skadi-server --target ${{ matrix.target }}
          else
            cargo build --release -p skadi-server --target ${{ matrix.target }}
          fi

      - name: Package binary
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skadicore-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge SHA256 checksums
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          (
            cd dist
            sha256sum skadicore-*.tar.gz > SHA256SUMS
          )
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SkadiCore ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/skadicore-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
