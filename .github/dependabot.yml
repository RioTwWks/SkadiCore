version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - enhancement
    # Path-vendored rustls не обновляется Dependabot'ом — см. UPSTREAM.toml + Renovate.
    ignore:
      - dependency-name: rustls
        versions: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - enhancement
