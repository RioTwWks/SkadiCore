version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - enhancement
    # Path-vendored rustls 0.22 + tonic 0.12 pin several crates until rebase.
    ignore:
      - dependency-name: rustls
        versions: ["*"]
      # Needs rustls 0.23 (vendored fork is still 0.22).
      - dependency-name: tokio-rustls
        versions: [">=0.26.0"]
      # Breaking API; coordinate with code updates.
      - dependency-name: rand
        versions: [">=0.9.0"]
      - dependency-name: hkdf
        versions: [">=0.13.0"]
      - dependency-name: x25519-dalek
        versions: [">=3.0.0"]
      # Needs tonic major bump together.
      - dependency-name: prost
        versions: [">=0.14.0"]
      - dependency-name: tonic
        versions: [">=0.13.0"]
      - dependency-name: tonic-build
        versions: [">=0.13.0"]
      # RustCrypto 0.2 line — needs hkdf/ml-kem coordinated bump; vendored rustls pins aes-gcm 0.10.
      - dependency-name: sha2
        versions: [">=0.11.0"]
      - dependency-name: aes-gcm
        versions: [">=0.11.0"]
      - dependency-name: ml-kem
        versions: [">=0.3.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - enhancement
