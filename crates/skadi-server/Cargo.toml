[package]
name = "skadi-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "skadi_server"
path = "src/lib.rs"

[[bin]]
name = "skadicore"
path = "src/main.rs"

[dependencies]
skadi-core.workspace = true
skadi-transport.workspace = true
skadi-protocol.workspace = true
skadi-api.workspace = true
tonic.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
base64.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
rand = "0.8"
# rustls 0.23 для tonic gRPC TLS (отдельно от workspace vendored 0.22)
grpc-rustls = { package = "rustls", version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[dev-dependencies]
rcgen = "0.13"
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
tempfile = "3"
base64.workspace = true
x25519-dalek.workspace = true
tonic.workspace = true
skadi-api.workspace = true
