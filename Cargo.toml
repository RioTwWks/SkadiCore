[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["RioTwWks ozrkrakodil@gmail.com"]
repository = "https://github.com/RioTwWks/SkadiCore"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Логирование и трейсинг
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Ошибки
anyhow = "1"
thiserror = "1"

# Сериализация
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# TLS (vendored fork с поддержкой REALITY, см. third_party/rustls-reality)
rustls = { path = "third_party/rustls-reality/rustls", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
tokio-rustls = "0.25"

# REALITY crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rcgen = "0.13"
ring = "0.17"

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tonic-build = "0.12"

# Метрики
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Бенчмарки
criterion = { version = "0.5", features = ["html_reports"] }

# Property-based тесты
proptest = "1"

# WireGuard / AmneziaWG config
wireguard-conf = { version = "2", features = ["amneziawg"] }
ipnet = "2"

# Внутренние крейты
skadi-core = { path = "crates/skadi-core" }
skadi-transport = { path = "crates/skadi-transport" }
skadi-protocol = { path = "crates/skadi-protocol" }
skadi-api = { path = "crates/skadi-api" }
skadi-client = { path = "crates/skadi-client" }
skadi-config = { path = "crates/skadi-config" }

[patch.crates-io]
rustls = { path = "third_party/rustls-reality/rustls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
