[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["RioTwWks ozrkrakodil@gmail.com"]
repository = "https://github.com/RioTwWks/SkadiCore"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Логирование и трейсинг
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Ошибки
anyhow = "1"
thiserror = "1"

# Сериализация
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"

# Внутренние крейты
skadi-core = { path = "crates/skadi-core" }
skadi-transport = { path = "crates/skadi-transport" }
skadi-protocol = { path = "crates/skadi-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
