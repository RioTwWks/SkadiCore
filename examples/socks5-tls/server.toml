# SkadiCore: SOCKS5 user-pass over TLS
# 1. ./examples/socks5-tls/generate-certs.sh
# 2. cargo run --bin skadicore -- --config examples/socks5-tls/server.toml

[server]
listen = "127.0.0.1:8443"

[transport.tls]
enabled = true
cert = "examples/socks5-tls/certs/server.pem"
key = "examples/socks5-tls/certs/server.key"
alpn = ["http/1.1"]

[protocol.socks5]
enabled = true
auth = "user-pass"

[[protocol.socks5.users]]
username = "alice"
password = "change-me-in-production"

[protocol.vless]
enabled = false
