# Локальный SOCKS5 → VLESS+REALITY (нативный rustls outbound, без Xray).
#
# remote.server     — куда подключаться по TCP (IP:port прокси)
# remote.reality.server_name — SNI в TLS ClientHello (должен быть в server_names на сервере)

[client]
listen = "127.0.0.1:10808"

[remote]
server = "127.0.0.1:443"
uuid = "b831381d-6324-4d53-ad4f-8cda48b30811"

[remote.tls]
enabled = false

[remote.reality]
enabled = true
# Xray password = URL-safe base64 публичного X25519 ключа сервера (skadicore genkey reality)
password = "REPLACE_WITH_XRAY_PASSWORD"
short_id = "0123456789abcdef"
server_name = "reality.test"
