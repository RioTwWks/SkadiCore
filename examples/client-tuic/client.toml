# Локальный SOCKS5 через внешний `tuic-client`.
#
# Сервер: examples/tuic/server.toml
# Требует: tuic-client в PATH или TUIC_CLIENT_BINARY

[client]
listen = "127.0.0.1:10808"

[tuic]
server = "127.0.0.1:8443"
uuid = "00000000-0000-0000-0000-000000000001"
password = "change-me-tuic"
# ip = "127.0.0.1"   # dial IP, если server — hostname из сертификата
congestion_control = "bbr"
alpn = ["h3"]
udp_relay_mode = "native"
# Для self-signed (lab):
allow_insecure = true
