# AmneziaWG client (AmneziaVPN / awg / wireguard-compatible apps)
# Сгенерируйте client private key: cargo run --bin skadicore -- genkey awg

[Interface]
PrivateKey = <client-private-key>
Address = 10.8.0.2/24
DNS = 1.1.1.1
MTU = 1420
Jc = 8
Jmin = 64
Jmax = 1024
S1 = 32
S2 = 32
S3 = 16
S4 = 16
H1 = 1-10000000
H2 = 10000001-20000000
H3 = 20000001-30000000
H4 = 30000001-40000000

[Peer]
PublicKey = <server-public-key>
Endpoint = 127.0.0.1:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
