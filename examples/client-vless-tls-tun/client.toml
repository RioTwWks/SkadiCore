# SOCKS5 + TUN → удалённый VLESS+TLS (Linux)
#
# Запуск (требуются права на создание TUN, обычно root или CAP_NET_ADMIN):
#   skadicore client --config examples/client-vless-tls-tun/client.toml
#
# При routing.auto = true маршрутизация настраивается автоматически.
# IP прокси-сервера добавляется в bypass, чтобы избежать петли маршрутизации.

[client]
listen = "127.0.0.1:1080"

[client.tun]
enabled = true
name = "skadi0"
address = "10.0.0.2"
gateway = "10.0.0.1"
netmask = "255.255.255.0"
mtu = 1400
# pmtud = "probe"      # измерить path MTU до прокси при старте (Linux)
# mtu_overhead = 100   # запас на VLESS+TLS оверхед

[client.tun.routing]
auto = true
table = 100
bypass = []

[client.tun.dns]
hijack = true
mode = "udp"   # или "doh" / "dot" (см. CONFIGURATION.md)
# block_system_dot = true
# block_system_doh = true
server = "8.8.8.8"

[remote]
server = "127.0.0.1:443"
uuid = "00000000-0000-0000-0000-000000000001"

[remote.tls]
enabled = true
server_name = "example.com"
